name: linear
description: Linear issue management

# Two ways to reach Linear, under one grant:
#
#   linear (this bag)   Barry's own ticket tools — namespace `linear`
#   linear-official     Linear's hosted MCP — namespace `linear-mcp`
#
# The local half lives HERE rather than in a `linear-local` sibling because it
# is a real package (src/, package.json, its own lockfile); moving it would buy
# symmetry and cost a build. The parent therefore owns the local tools and
# composes the official half.
#
# Deliberately NO `traits:` block. A manifest trait reusing the auto-trait's
# name REPLACES it rather than refining it (getAllTraits — "the manifest wins"),
# which would discard everything `bags:` absorbs.
bags:
  - linear-official

tools:
  entry: tools.ts
  env:
    - LINEAR_API_KEY

# Native in-process tools namespace as `linear` (see src/tools.ts). Declared
# here so trait/namespace derivations (auto-traits, doctor, MCP boot checks)
# know the bag provides the `linear` namespace alongside `linear-mcp`.
tool-metadata:
  - { toolName: ticket_get, namespace: linear, access: read }
  - { toolName: ticket_list, namespace: linear, access: read }
  - { toolName: ticket_search, namespace: linear, access: read }
  - { toolName: ticket_list_comments, namespace: linear, access: read }
  - { toolName: ticket_list_statuses, namespace: linear, access: read }
  - { toolName: ticket_list_teams, namespace: linear, access: read }
  - { toolName: ticket_list_labels, namespace: linear, access: read }
  - { toolName: ticket_get_project, namespace: linear, access: read }
  - { toolName: ticket_get_cycle, namespace: linear, access: read }
  - { toolName: ticketing_status, namespace: linear, access: read }
  - { toolName: ticket_update, namespace: linear, access: readwrite }
  - { toolName: ticket_add_comment, namespace: linear, access: readwrite }
  - { toolName: ticket_create, namespace: linear, access: readwrite }

# The hosted Linear MCP and its npx dependency now live in `linear-official`,
# composed above.
