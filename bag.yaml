name: linear
description: Linear issue management

# Native ticket tools use linear; hosted vendor tools retain linear-mcp.
# Both implementations are owned by this bag.
mcp-servers:
  linear-mcp:
    command: npx
    args:
      [
        "-y",
        "mcp-remote",
        "https://mcp.linear.app/mcp",
        "--header",
        "Authorization: Bearer ${LINEAR_API_KEY}"
      ]
    env: [ LINEAR_API_KEY ]

dependencies:
  npx:
    reason: runs Linear's hosted MCP server via mcp-remote
    install:
      macos: brew install node
